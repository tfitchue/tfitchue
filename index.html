<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FedEx Freight Weather Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#00389f;
    color:white;
    font-family:"Segoe UI",Arial,sans-serif;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    max-width:500px;
    width:90%;
    height:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:rgba(0,0,0,.20);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:25px;
    text-align:center;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

.city{
    font-size:28px;
    font-weight:bold;
}

.time{
    font-size:42px;
    color:#ff6600;
    margin:15px 0;
    font-weight:bold;
}

.icon{
    font-size:90px;
    margin:10px 0;
}

.temp{
    font-size:64px;
    font-weight:bold;
}

.condition{
    font-size:28px;
    margin:10px 0;
}

.details{
    font-size:20px;
    line-height:1.8;
}

.updated{
    text-align:center;
    margin-top:25px;
    color:#ddd;
    font-size:18px;
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" alt="FedEx Freight   <div class="card" id="harrison">
        <div class="city">Harrison, AR</div>
        <div class="time">--:--:--</div>
        <div class="icon">⏳</div>
        <div class="temp">--°F</div>
        <div class="condition">Loading...</div>
        <div class="details"></div>
    </div>

    <div class="card" id="memphis">
        <div class="city">Memphis, TN</div>
        <div class="time">--:--:--</div>
        <div class="icon">⏳</div>
        <div class="temp">--°F</div>
        <div class="condition">Loading...</div>
        <div class="details"></div>
    </div>

    <div class="card" id="newyork">
        <div class="city">New York, NY</div>
        <div class="time">--:--:--</div>
        <div class="icon">⏳</div>
        <div class="temp">--°F</div>
        <div class="condition">Loading...</div>
        <div class="details"></div>
    </div>

    <div class="card" id="losangeles">
        <div class="city">Los Angeles, CA</div>
        <div class="time">--:--:--</div>
        <div class="icon">⏳</div>
        <div class="temp">--°F</div>
        <div class="condition">Loading...</div>
        <div class="details"></div>
    </div>

</div>

<div class="updated" id="updated"></div>

<script>

const cities = [
{
id:"harrison",
lat:36.2298,
lon:-93.1077,
timezone:"America/Chicago"
},
{
id:"memphis",
lat:35.1495,
lon:-90.0490,
timezone:"America/Chicago"
},
{
id:"newyork",
lat:40.7128,
lon:-74.0060,
timezone:"America/New_York"
},
{
id:"losangeles",
lat:34.0522,
lon:-118.2437,
timezone:"America/Los_Angeles"
}
];

function getWeatherInfo(code){

const map = {
0:["☀️","Clear"],
1:["🌤️","Mostly Clear"],
2:["⛅","Partly Cloudy"],
3:["☁️","Overcast"],
45:["🌫️","Fog"],
48:["🌫️","Freezing Fog"],
51:["🌦️","Light Drizzle"],
53:["🌦️","Drizzle"],
55:["🌧️","Heavy Drizzle"],
61:["🌦️","Light Rain"],
63:["🌧️","Rain"],
65:["🌧️","Heavy Rain"],
71:["🌨️","Light Snow"],
73:["❄️","Snow"],
75:["❄️","Heavy Snow"],
80:["🌦️","Rain Showers"],
81:["🌧️","Heavy Showers"],
82:["⛈️","Strong Showers"],
95:["⛈️","Thunderstorm"],
96:["⛈️","Thunderstorm + Hail"],
99:["⛈️","Severe Thunderstorm"]
};

return map[code] || ["❓","Unknown"];

}

async function updateWeather(){

for(const city of cities){

try{

const response = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph`
);

const data = await response.json();

if(!data.current){
throw new Error("Weather data unavailable");
}

const card = document.getElementById(city.id);

const [icon,condition] =
getWeatherInfo(data.current.weather_code);

card.querySelector(".icon").textContent = icon;
card.querySelector(".condition").textContent = condition;
card.querySelector(".temp").textContent =
Math.round(data.current.temperature_2m) + "°F";

card.querySelector(".details").innerHTML =
`💧 Humidity: ${data.current.relative_humidity_2m}%<br>
🌬️ Wind: ${Math.round(data.current.wind_speed_10m)} MPH`;

}
catch(error){

const card = document.getElementById(city.id);

card.querySelector(".icon").textContent = "⚠️";
card.querySelector(".condition").textContent =
"Weather Unavailable";
card.querySelector(".temp").textContent = "--°F";
card.querySelector(".details").textContent = "";

console.error(error);
}

}

document.getElementById("updated").textContent =
"Last Updated: " + new Date().toLocaleString();

}

function updateClocks(){

cities.forEach(city => {

const timeString =
new Date().toLocaleTimeString("en-US",{
timeZone:city.timezone,
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
});

document
.getElementById(city.id)
.querySelector(".time")
.textContent = timeString;

});

}

updateWeather();
updateClocks();

setInterval(updateWeather,20000);
setInterval(updateClocks,1000);

</script>

</body>
</html>
