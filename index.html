<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSOC Weather Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#063fbc;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
}

#pageBackground{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.55;
    pointer-events:none;
    z-index:0;
}

main{
    position:relative;
    z-index:1;
    width:100%;
    height:100vh;
    padding:20px;
}

.weather-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    width:100%;
    height:100%;
}

.card{
    background:rgba(0,40,110,.55);

    backdrop-filter:blur(8px) saturate(150%);
    -webkit-backdrop-filter:blur(8px) saturate(150%);

    border:1px solid rgba(255,255,255,.15);
    border-top:6px solid #ff6600;

    border-radius:16px;
    padding:24px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;

    box-shadow:
        0 8px 32px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 0 40px rgba(0,80,255,.25);
}

.city{
    font-size:2.4rem;
    font-weight:800;
    text-shadow:0 0 12px rgba(0,0,0,.9);
}

.zone{
    margin-top:8px;
    color:#d7e5ff;
    font-size:1.2rem;
    font-weight:700;
    letter-spacing:1px;
}

.time{
    margin:15px 0;
    color:#ff8b3d;
    font-size:3.8rem;
    font-weight:800;
    font-variant-numeric:tabular-nums;
}

.icon{
    font-size:5rem;
    line-height:1;
}

.temp{
    font-size:6rem;
    font-weight:900;
    margin-top:10px;
}

.condition{
    font-size:1.8rem;
    font-weight:700;
    margin-top:10px;
}

.feels{
    color:#fff;
    font-size:1.2rem;
    font-weight:600;
    margin-top:5px;
}

.highlow{
    color:#ffb17c;
    font-size:1.4rem;
    font-weight:700;
    margin-top:10px;
}

.section{
    margin-top:16px;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.15);
    color:#ffb17c;
    font-size:1.1rem;
    font-weight:700;
    text-transform:uppercase;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:1.2rem;
    font-weight:600;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.row span{
    color:#d7e5ff;
}

#backgroundError{
    position:fixed;
    right:10px;
    bottom:10px;
    background:#8b1926;
    padding:10px;
    border-radius:6px;
    z-index:50;
}

@media (max-width:1600px){
    .weather-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media (max-width:1100px){
    body{
        overflow:auto;
    }

    .weather-grid{
        grid-template-columns:repeat(2,1fr);
        height:auto;
    }

    main{
        height:auto;
    }
}

@media (max-width:700px){
    .weather-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<img id="pageBackground" src="logo.png" alt="Background Logo">

<div id="backgroundError" hidden>
Unable to load logo.png
</div>

<main>
    <div id="weatherGrid" class="weather-grid"></div>
</main>

<script>
"use strict";

const WEATHER_ENDPOINT =
    "https://api.open-meteo.com/v1/forecast";

const cities = [
{
    id:"harrison",
    name:"Harrison, AR",
    lat:36.2298,
    lon:-93.1077,
    tz:"America/Chicago",
    zone:"CENTRAL"
},
{
    id:"memphis",
    name:"Memphis, TN",
    lat:35.1495,
    lon:-90.0490,
    tz:"America/Chicago",
    zone:"CENTRAL"
},
{
    id:"newyork",
    name:"New York, NY",
    lat:40.7128,
    lon:-74.0060,
    tz:"America/New_York",
    zone:"EASTERN"
},
{
    id:"losangeles",
    name:"Los Angeles, CA",
    lat:34.0522,
    lon:-118.2437,
    tz:"America/Los_Angeles",
    zone:"PACIFIC"
},
{
    id:"denver",
    name:"Denver, CO",
    lat:39.7392,
    lon:-104.9903,
    tz:"America/Denver",
    zone:"MOUNTAIN"
}
];

const weatherCodes = {
0:["☀️","Clear"],
1:["🌤️","Mostly Clear"],
2:["⛅","Partly Cloudy"],
3:["☁️","Cloudy"],
45:["🌫️","Fog"],
48:["🌫️","Fog"],
51:["🌦️","Light Drizzle"],
53:["🌦️","Drizzle"],
55:["🌧️","Heavy Drizzle"],
61:["🌦️","Light Rain"],
63:["🌧️","Rain"],
65:["🌧️","Heavy Rain"],
71:["🌨️","Light Snow"],
73:["❄️","Snow"],
75:["❄️","Heavy Snow"],
80:["🌦️","Showers"],
81:["🌧️","Rain Showers"],
82:["⛈️","Heavy Showers"],
95:["⛈️","Thunderstorm"],
96:["⛈️","Storm"],
99:["⛈️","Severe Storm"]
};

function number(value,digits=0){
    return typeof value==="number" && Number.isFinite(value)
        ? value.toFixed(digits)
        : "--";
}

function row(label,value){
    return `
    <div class="row">
        <span>${label}</span>
        <strong>${value}</strong>
    </div>
    `;
}

document.getElementById("weatherGrid").innerHTML =
cities.map(city => `
<article class="card" id="${city.id}">
    <div class="city">${city.name}</div>
    <div class="zone">${city.zone} TIME</div>
    <div class="time">--:--:--</div>
    <div class="icon">🌤️</div>
    <div class="temp">--°F</div>
    <div class="condition">Loading...</div>
    <div class="feels"></div>
    <div class="highlow">H: --°F | L: --°F</div>

    <div class="section">Current Conditions</div>

    <div class="current"></div>
</article>
`).join("");

let onlineTimeOffset = 0;

async function syncOnlineTime(){

    try{

        const response = await fetch(
            "https://worldtimeapi.org/api/timezone/Etc/UTC",
            {cache:"no-store"}
        );

        const data = await response.json();

        const serverTime =
            new Date(data.utc_datetime).getTime();

        onlineTimeOffset =
            serverTime - Date.now();

    }catch(error){

        console.error(
            "Internet time sync failed:",
            error
        );

    }
}

function updateClocks(){

    const syncedNow =
        new Date(Date.now() + onlineTimeOffset);

    cities.forEach(city => {

        document.querySelector(
            `#${city.id} .time`
        ).textContent =
            syncedNow.toLocaleTimeString(
                "en-US",
                {
                    timeZone:city.tz,
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

    });

    const delay =
        1000 - (Date.now() % 1000);

    setTimeout(updateClocks, delay);
}

async function getJSON(url){

    const response = await fetch(url);

    if(!response.ok){
        throw new Error(response.status);
    }

    return response.json();
}

async function updateWeather(){

    await Promise.all(

        cities.map(async city => {

            const card =
                document.getElementById(city.id);

            try{

                const url =
                    new URL(WEATHER_ENDPOINT);

                url.search =
                    new URLSearchParams({
                        latitude:city.lat,
                        longitude:city.lon,

                        current:[
                            "temperature_2m",
                            "relative_humidity_2m",
                            "apparent_temperature",
                            "weather_code",
                            "wind_speed_10m",
                            "wind_gusts_10m"
                        ].join(","),

                        daily:[
                            "temperature_2m_max",
                            "temperature_2m_min"
                        ].join(","),

                        temperature_unit:"fahrenheit",
                        wind_speed_unit:"mph",
                        timezone:city.tz
                    });

                const data =
                    await getJSON(url);

                const c = data.current;
                const d = data.daily;

                const condition =
                    weatherCodes[c.weather_code] ||
                    ["❓","Unknown"];

                card.querySelector(".icon").textContent =
                    condition[0];

                card.querySelector(".condition").textContent =
                    condition[1];

                card.querySelector(".temp").textContent =
                    number(c.temperature_2m) + "°F";

                card.querySelector(".feels").textContent =
                    "Feels Like " +
                    number(c.apparent_temperature) +
                    "°F";

                card.querySelector(".highlow").textContent =
                    "H: " +
                    number(d.temperature_2m_max[0]) +
                    "°F | L: " +
                    number(d.temperature_2m_min[0]) +
                    "°F";

                card.querySelector(".current").innerHTML =
                    [
                        [
                            "Humidity",
                            number(
                                c.relative_humidity_2m
                            ) + "%"
                        ],
                        [
                            "Wind",
                            number(
                                c.wind_speed_10m
                            ) + " mph"
                        ],
                        [
                            "Gusts",
                            number(
                                c.wind_gusts_10m
                            ) + " mph"
                        ]
                    ]
                    .map(v => row(...v))
                    .join("");

            }catch(error){

                console.error(error);

                card.querySelector(".condition")
                    .textContent =
                    "Weather Unavailable";

            }

        })

    );
}

const bg =
    document.getElementById("pageBackground");

const bgError =
    document.getElementById("backgroundError");

bg.onload = () => bgError.hidden = true;
bg.onerror = () => bgError.hidden = false;

syncOnlineTime();
setInterval(syncOnlineTime, 600000);

updateClocks();

updateWeather();
setInterval(updateWeather, 300000);
</script>

</body>
</html>
