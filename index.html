
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FedEx Freight Weather Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --blue: #063fbc;
    --orange: #ff6600;
    --text: #ffffff;
}

body {
    margin: 0;
    padding: 22px;
    min-height: 100vh;
    background: linear-gradient(135deg, #052b80, #063fbc);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    position: relative;
}

/* FedEx logo watermark */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("logo.png") center center / 85% auto no-repeat;
    opacity: .10;
    pointer-events: none;
    z-index: 0;
}

main {
    position: relative;
    z-index: 1;
}

header {
    text-align: center;
    margin-bottom: 22px;
}

header h1 {
    margin: 0;
    font-size: clamp(26px, 2.5vw, 42px);
    letter-spacing: 1px;
}

header h1 span {
    color: var(--orange);
}

.subtitle {
    margin-top: 8px;
    font-size: 16px;
    opacity: .85;
}

/* Always keep five cities on one horizontal row */
.dashboard-scroll {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(245px, 1fr));
    gap: 14px;
    min-width: 1280px;
    align-items: stretch;
}

.card {
    background: rgba(0, 13, 55, .74);
    border: 1px solid rgba(255, 255, 255, .20);
    backdrop-filter: blur(8px);
    border-radius: 17px;
    padding: 17px;
    text-align: center;
    min-width: 0;
    border-top: 4px solid var(--orange);
}

.city {
    font-size: clamp(22px, 1.6vw, 29px);
    font-weight: 750;
    white-space: nowrap;
}

.timezone {
    font-size: 12px;
    letter-spacing: 1px;
    opacity: .75;
    margin-top: 5px;
}

.time {
    color: var(--orange);
    font-size: clamp(26px, 2vw, 37px);
    font-weight: 700;
    margin: 12px 0;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.icon {
    font-size: 62px;
    line-height: 1.2;
}

.temp {
    font-size: clamp(43px, 3.2vw, 63px);
    font-weight: 800;
    margin-top: 6px;
}

.condition {
    font-size: 19px;
    font-weight: 600;
    min-height: 48px;
    margin-top: 7px;
}

.feels-like {
    color: #d8e5ff;
    font-size: 16px;
    margin-top: 5px;
}

/* Section headings */
.section-title {
    margin-top: 20px;
    padding: 8px 0;
    color: #ffb078;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255,255,255,.25);
    text-align: left;
}

/* Weather detail rows */
.weather-details {
    margin-top: 9px;
}

.detail-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.09);
    font-size: 14px;
}

.detail-row .label {
    color: #d4e1ff;
    text-align: left;
}

.detail-row .value {
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* Daily high / low */
.high-low {
    display: flex;
    justify-content: space-around;
    padding: 14px 0 4px;
    font-size: 20px;
    font-weight: bold;
}

.high {
    color: #ffa364;
}

.low {
    color: #a8d4ff;
}

/* Freight operation alerts */
.impact {
    margin-top: 18px;
    border-radius: 10px;
    padding: 12px 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    background: rgba(0, 150, 90, .23);
    border: 1px solid rgba(70, 230, 160, .4);
}

.impact.caution {
    background: rgba(255, 170, 0, .2);
    border-color: #ffb347;
}

.impact.warning {
    background: rgba(230, 45, 45, .25);
    border-color: #ff5555;
}

/* Footer */
.footer {
    margin-top: 22px;
    text-align: center;
    font-size: 15px;
}

.updated {
    color: #dce8ff;
    margin-bottom: 6px;
}

.source {
    font-size: 12px;
    opacity: .70;
}

@media (min-width: 1900px) {
    .grid {
        min-width: 0;
    }

    .card {
        padding: 22px;
    }

    .detail-row {
        font-size: 16px;
    }
}

</style>
</head>

<body>

<main>

<header>
    <h1>FedEx <span>Freight</span> Weather Dashboard</h1>
    <div class="subtitle">
        FSOC | Live Weather & Operational Awareness
    </div>
</header>

<div class="dashboard-scroll">
    <div class="grid" id="weatherGrid"></div>
</div>

<div class="footer">
    <div class="updated" id="updated">
        Loading weather observations...
    </div>
    <div class="source">
        Weather data: Open-Meteo |
        Automatically refreshes every 5 minutes
        <div id="refreshStatus"></div>
    </div>
</div>

</main>

<script>

/* Cities and local time zones */
const cities = [
    {
        id: "harrison",
        name: "Harrison, AR",
        lat: 36.2298,
        lon: -93.1077,
        tz: "America/Chicago",
        zone: "CENTRAL TIME"
    },
    {
        id: "memphis",
        name: "Memphis, TN",
        lat: 35.1495,
        lon: -90.0490,
        tz: "America/Chicago",
        zone: "CENTRAL TIME"
    },
    {
        id: "newyork",
        name: "New York, NY",
        lat: 40.7128,
        lon: -74.0060,
        tz: "America/New_York",
        zone: "EASTERN TIME"
    },
    {
        id: "losangeles",
        name: "Los Angeles, CA",
        lat: 34.0522,
        lon: -118.2437,
        tz: "America/Los_Angeles",
        zone: "PACIFIC TIME"
    },
    {
        id: "denver",
        name: "Denver, CO",
        lat: 39.7392,
        lon: -104.9903,
        tz: "America/Denver",
        zone: "MOUNTAIN TIME"
    }
];

/* Helper functions */

function formatNumber(value, digits = 0) {
    if (value === null || value === undefined) {
        return "--";
    }
    return Number(value).toFixed(digits);
}

function degreesToDirection(degrees) {
    if (degrees == null) return "--";

    const directions = [
        "N", "NE", "E", "SE",
        "S", "SW", "W", "NW"
    ];

    return directions[
        Math.round(degrees / 45) % 8
    ];
}

function weatherData(code, isDay = 1) {

    const codes = {
        0: [isDay ? "☀️" : "🌙", "Clear"],
        1: [isDay ? "🌤️" : "🌙", "Mostly Clear"],
        2: ["⛅", "Partly Cloudy"],
        3: ["☁️", "Overcast"],
        45: ["🌫️", "Fog"],
        48: ["🌫️", "Freezing Fog"],
        51: ["🌦️", "Light Drizzle"],
        53: ["🌦️", "Drizzle"],
        55: ["🌧️", "Heavy Drizzle"],
        56: ["🌧️", "Freezing Drizzle"],
        57: ["🌧️", "Heavy Freezing Drizzle"],
        61: ["🌦️", "Light Rain"],
        63: ["🌧️", "Rain"],
        65: ["🌧️", "Heavy Rain"],
        66: ["🧊", "Freezing Rain"],
        67: ["🧊", "Heavy Freezing Rain"],
        71: ["🌨️", "Light Snow"],
        73: ["❄️", "Snow"],
        75: ["❄️", "Heavy Snow"],
        77: ["🌨️", "Snow Grains"],
        80: ["🌦️", "Light Showers"],
        81: ["🌧️", "Rain Showers"],
        82: ["🌧️", "Violent Showers"],
        85: ["🌨️", "Snow Showers"],
        86: ["❄️", "Heavy Snow Showers"],
        95: ["⛈️", "Thunderstorm"],
        96: ["⛈️", "Storm with Hail"],
        99: ["⛈️", "Heavy Storm with Hail"]
    };

    return codes[code] || ["❓", "Unknown"];
}

function formatSolarTime(value, timezone) {
    if (!value) return "--";

    // Open-Meteo returns local time without a timezone offset
    const time = value.split("T")[1];
    if (!time) return "--";

    const [hour, minute] = time.split(":").map(Number);
    const h12 = hour % 12 || 12;

    return `${h12}:${String(minute).padStart(2,"0")} ` +
           (hour >= 12 ? "PM" : "AM");
}

function detailRow(label, value) {
    return `
        <div class="detail-row">
            <span class="label">${label}</span>
            <span class="value">${value}</span>
        </div>
    `;
}

/* Build each city card */
function createCards() {

    const grid = document.getElementById("weatherGrid");

    grid.innerHTML = cities.map(city => `
        <div class="card" id="${city.id}">

            <div class="city">${city.name}</div>
            <div class="timezone">${city.zone}</div>

            <div class="time">--:--:--</div>
            <div class="icon">🌤️</div>
            <div class="temp">--°F</div>
            <div class="condition">Loading...</div>
            <div class="feels-like"></div>

            <div class="section-title">
                Current Conditions
            </div>
            <div class="current-details weather-details"></div>

            <div class="section-title">
                Today's Forecast
            </div>
            <div class="high-low"></div>
            <div class="forecast-details weather-details"></div>

            <div class="section-title">
                Freight Weather Awareness
            </div>
            <div class="impact">Checking conditions...</div>

        </div>
    `).join("");
}

/* Operational indicators: screening only, not official alerts */
function weatherImpact(current) {

    const issues = [];
    let level = "normal";

    const gust = current.wind_gusts_10m;
    const wind = current.wind_speed_10m;
    const visibility = current.visibility;
    const temp = current.temperature_2m;
    const precipitation = current.precipitation;
    const code = current.weather_code;

    if (gust != null && gust >= 45) {
        issues.push("💨 Strong wind gusts");
        level = "warning";
    }
    else if (wind != null && wind >= 25) {
        issues.push("🌬️ Elevated wind speeds");
        level = "caution";
    }
    else if (gust != null && gust >= 30) {
        issues.push("🌬️ Gusty conditions");
        level = "caution";
    }

    if (visibility != null && visibility < 1609) {
        issues.push("🌫️ Very low visibility");
        level = "warning";
    }
    else if (visibility != null && visibility < 4828) {
        issues.push("🌫️ Reduced visibility");
        if (level !== "warning") level = "caution";
    }

    if ([66, 67, 73, 75, 77, 85, 86].includes(code)) {
        issues.push("🧊 Potential winter road hazards");
        if (level !== "warning") level = "caution";
    }

    if ([95, 96, 99].includes(code)) {
        issues.push("⛈️ Thunderstorm conditions");
        level = "warning";
    }

    if (
        precipitation != null &&
        precipitation >= 0.25
    ) {
        issues.push("🌧️ Significant precipitation");
        if (level !== "warning") level = "caution";
    }

    if (temp != null && temp <= 32 &&
        precipitation != null && precipitation > 0) {
        issues.push("❄️ Freezing precipitation concern");
        level = "warning";
    }

    if (issues.length === 0) {
        return {
            level: "normal",
            message: "✅ No preset weather thresholds exceeded"
        };
    }

    return {
        level,
        message: issues.join("<br>")
    };
}

/* Retrieve weather data */
async function updateWeather() {

    document.getElementById("refreshStatus").textContent =
        "Refreshing weather data...";

    let successful = 0;

    await Promise.all(cities.map(async city => {

        const card = document.getElementById(city.id);

        try {

            const url = new URL(
                "https://api.open-meteo.com/v1/forecast"
            );

            url.search = new URLSearchParams({
                latitude: city.lat,
                longitude: city.lon,

                current: [
                    "temperature_2m",
                    "relative_humidity_2m",
                    "apparent_temperature",
                    "weather_code",
                    "is_day",
                    "wind_speed_10m",
                    "wind_direction_10m",
                    "wind_gusts_10m",
                    "precipitation",
                    "cloud_cover",
                    "visibility",
                    "surface_pressure"
                ].join(","),

                daily: [
                    "temperature_2m_max",
                    "temperature_2m_min",
                    "precipitation_probability_max",
                    "uv_index_max",
                    "sunrise",
                    "sunset"
                ].join(","),

                temperature_unit: "fahrenheit",
                wind_speed_unit: "mph",
                precipitation_unit: "inch",
                timezone: city.tz,
                forecast_days: 1
            });

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            const c = data.current;
            const d = data.daily;

            if (!c || !d) {
                throw new Error("Weather data unavailable");
            }

            const weather = weatherData(
                c.weather_code,
                c.is_day
            );

            card.querySelector(".icon").textContent =
                weather[0];

            card.querySelector(".condition").textContent =
                weather[1];

            card.querySelector(".temp").textContent =
                Math.round(c.temperature_2m) + "°F";

            card.querySelector(".feels-like").textContent =
                "Feels Like " +
                formatNumber(c.apparent_temperature) +
                "°F";

            const visibilityMiles =
                c.visibility != null
                ? (c.visibility / 1609.344).toFixed(1)
                : "--";

            const windDirection =
                degreesToDirection(c.wind_direction_10m);

            const currentDetails = [
                ["💧 Humidity",
                    formatNumber(c.relative_humidity_2m) + "%"],
                ["🌬️ Wind Speed",
                    formatNumber(c.wind_speed_10m) + " MPH"],
                ["🧭 Wind Direction",
                    windDirection],
                ["💨 Wind Gusts",
                    formatNumber(c.wind_gusts_10m) + " MPH"],
                ["🌫️ Visibility",
                    visibilityMiles + " mi"],
                ["☁️ Cloud Cover",
                    formatNumber(c.cloud_cover) + "%"],
                ["🌧️ Precipitation",
                    formatNumber(c.precipitation, 2) + " in"],
                ["🌡️ Air Pressure",
                    formatNumber(c.surface_pressure, 0) + " hPa"]
            ];

            card.querySelector(".current-details").innerHTML =
                currentDetails.map(row =>
                    detailRow(row[0], row[1])
                ).join("");

            const high = d.temperature_2m_max?.[0];
            const low = d.temperature_2m_min?.[0];

            card.querySelector(".high-low").innerHTML = `
                <span class="high">
                    ↑ ${formatNumber(high)}°F
                </span>
                <span class="low">
                    ↓ ${formatNumber(low)}°F
                </span>
            `;

            const forecastDetails = [
                ["🌧️ Rain Chance",
                    formatNumber(
                        d.precipitation_probability_max?.[0]
                    ) + "%"],
                ["☀️ Max UV Index",
                    formatNumber(d.uv_index_max?.[0], 1)],
                ["🌅 Sunrise",
                    formatSolarTime(d.sunrise?.[0], city.tz)],
                ["🌇 Sunset",
                    formatSolarTime(d.sunset?.[0], city.tz)]
            ];

            card.querySelector(".forecast-details").innerHTML =
                forecastDetails.map(row =>
                    detailRow(row[0], row[1])
                ).join("");

            const impact = weatherImpact(c);
            const impactElement = card.querySelector(".impact");

            impactElement.className =
                "impact " + impact.level;

            impactElement.innerHTML = impact.message;

            successful++;

        } catch (error) {

            console.error(city.name, error);

            card.querySelector(".icon").textContent = "⚠️";
            card.querySelector(".condition").textContent =
                "Data Unavailable";
            card.querySelector(".temp").textContent = "--°F";
            card.querySelector(".feels-like").textContent = "";
            card.querySelector(".impact").className =
                "impact caution";
            card.querySelector(".impact").textContent =
                "⚠️ Unable to retrieve weather information";
        }

    }));

    const now = new Date();

    document.getElementById("updated").textContent =
        "Last Weather Refresh: " + now.toLocaleString();

    document.getElementById("refreshStatus").textContent =
        `${successful} of ${cities.length} cities updated`;

}

/* City clocks */
function updateClocks() {

    const now = new Date();

    cities.forEach(city => {

        const time = now.toLocaleTimeString("en-US", {
            timeZone: city.tz,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        });

        document.getElementById(city.id)
            .querySelector(".time")
            .textContent = time;

    });
}

/* Initialization */
createCards();
updateClocks();
updateWeather();

/* Refresh */
setInterval(updateClocks, 1000);
setInterval(updateWeather, 300000);

</script>

</body>
</html>
