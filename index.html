<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSOC Weather Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#063fbc;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
}

/* Full-screen background logo */
#pageBackground{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.75;
    pointer-events:none;
    z-index:0;
}

/* Main content */
main{
    position:relative;
    z-index:1;
    width:100%;
    height:100vh;
    padding:20px;
}

.weather-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    width:100%;
    height:100%;
}

/* More visible frosted-glass cards */
.card{
    background:rgba(255,255,255,.010);
    backdrop-filter:blur(1px);
    -webkit-backdrop-filter:blur(1px);

    border:1px solid rgba(255,255,255,.08);
    border-top:6px solid #ff6600;

    border-radius:16px;
    padding:20px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
}

.city{
    font-size:2rem;
    font-weight:800;
    text-shadow:0 0 12px rgba(0,0,0,.9);
}

.zone{
    margin-top:8px;
    color:#d7e5ff;
    font-size:1rem;
    letter-spacing:1px;
    text-shadow:0 0 8px rgba(0,0,0,.8);
}

.time{
    margin:15px 0;
    color:#ff8b3d;
    font-size:3rem;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 15px rgba(0,0,0,.8);
}

.icon{
    font-size:5rem;
    line-height:1;
}

.temp{
    font-size:5rem;
    font-weight:800;
    margin-top:10px;
    text-shadow:0 0 20px rgba(0,0,0,.9);
}

.condition{
    font-size:1.5rem;
    margin-top:10px;
    text-shadow:0 0 10px rgba(0,0,0,.8);
}

.feels{
    color:#d7e5ff;
    font-size:1rem;
    margin-top:5px;
}

.highlow{
    color:#ffb17c;
    font-size:1.2rem;
    font-weight:700;
    margin-top:8px;
}

.section{
    margin-top:16px;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.15);
    color:#ffb17c;
    font-size:.9rem;
    font-weight:700;
    text-transform:uppercase;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:.95rem;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.row span{
    color:#d7e5ff;
}

#backgroundError{
    position:fixed;
    right:10px;
    bottom:10px;
    background:#8b1926;
    padding:10px;
    border-radius:6px;
    z-index:50;
}

@media (max-width:1600px){
    .weather-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media (max-width:1100px){
    body{
        overflow:auto;
    }

    .weather-grid{
        grid-template-columns:repeat(2,1fr);
        height:auto;
    }

    main{
        height:auto;
    }
}

@media (max-width:700px){
    .weather-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<img id="pageBackground" src="logo.png" alt="FedEx Freight Logo Background">

<div id="backgroundError" hidden>
Unable to load logo.png
</div>

<main>
    <div id="weatherGrid" class="weather-grid"></div>
</main>

<script>
"use strict";

const WEATHER_ENDPOINT = "https://api.open-meteo.com/v1/forecast";

const cities = [
{
    id:"harrison",
    name:"Harrison, AR",
    lat:36.2298,
    lon:-93.1077,
    tz:"America/Chicago",
    zone:"CENTRAL"
},
{
    id:"memphis",
    name:"Memphis, TN",
    lat:35.1495,
    lon:-90.0490,
    tz:"America/Chicago",
    zone:"CENTRAL"
},
{
    id:"newyork",
    name:"New York, NY",
    lat:40.7128,
    lon:-74.0060,
    tz:"America/New_York",
    zone:"EASTERN"
},
{
    id:"losangeles",
    name:"Los Angeles, CA",
    lat:34.0522,
    lon:-118.2437,
    tz:"America/Los_Angeles",
    zone:"PACIFIC"
},
{
    id:"denver",
    name:"Denver, CO",
    lat:39.7392,
    lon:-104.9903,
    tz:"America/Denver",
    zone:"MOUNTAIN"
}
];

const weatherCodes = {
0:["☀️","Clear"],
1:["🌤️","Mostly Clear"],
2:["⛅","Partly Cloudy"],
3:["☁️","Cloudy"],
45:["🌫️","Fog"],
48:["🌫️","Fog"],
51:["🌦️","Light Drizzle"],
53:["🌦️","Drizzle"],
55:["🌧️","Heavy Drizzle"],
61:["🌦️","Light Rain"],
63:["🌧️","Rain"],
65:["🌧️","Heavy Rain"],
71:["🌨️","Light Snow"],
73:["❄️","Snow"],
75:["❄️","Heavy Snow"],
80:["🌦️","Showers"],
81:["🌧️","Rain Showers"],
82:["⛈️","Heavy Showers"],
95:["⛈️","Thunderstorm"],
96:["⛈️","Storm"],
99:["⛈️","Severe Storm"]
};

function number(value,digits=0){
    return typeof value==="number" && Number.isFinite(value)
        ? value.toFixed(digits)
        : "--";
}

function row(label,value){
    return `
    <div class="row">
        <span>${label}</span>
        <strong>${value}</strong>
    </div>
    `;
}

document.getElementById("weatherGrid").innerHTML =
cities.map(city => `
<article class="card" id="${city.id}">
    <div class="city">${city.name}</div>
    <div class="zone">${city.zone} TIME</div>
    <div class="time">--:--:--</div>
    <div class="icon">🌤️</div>
    <div class="temp">--°F</div>
    <div class="condition">Loading...</div>
    <div class="feels"></div>
    <div class="highlow">H: --°F | L: --°F</div>

    <div class="section">Current Conditions</div>

    <div class="current"></div>
</article>
`).join("");

function updateClocks(){
    const now = new Date();

    cities.forEach(city=>{
        document.querySelector(`#${city.id} .time`).textContent =
            now.toLocaleTimeString("en-US",{
                timeZone:city.tz,
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            });
    });
}

async function getJSON(url){
    const response = await fetch(url);

    if(!response.ok){
        throw new Error(response.status);
    }

    return response.json();
}

async function updateWeather(){

    await Promise.all(
        cities.map(async city=>{

            const card = document.getElementById(city.id);

            try{

                const url = new URL(WEATHER_ENDPOINT);

                url.search = new URLSearchParams({
                    latitude:city.lat,
                    longitude:city.lon,
                    current:[
                        "temperature_2m",
                        "relative_humidity_2m",
                        "apparent_temperature",
                        "weather_code",
                        "wind_speed_10m",
                        "wind_gusts_10m"
                    ].join(","),

                    daily:[
                        "temperature_2m_max",
                        "temperature_2m_min"
                    ].join(","),

                    temperature_unit:"fahrenheit",
                    wind_speed_unit:"mph",
                    timezone:city.tz
                });

                const data = await getJSON(url);

                const c = data.current;
                const d = data.daily;

                const condition =
                    weatherCodes[c.weather_code] ||
                    ["❓","Unknown"];

                card.querySelector(".icon").textContent = condition[0];
                card.querySelector(".condition").textContent = condition[1];

                card.querySelector(".temp").textContent =
                    number(c.temperature_2m) + "°F";

                card.querySelector(".feels").textContent =
                    "Feels Like " +
                    number(c.apparent_temperature) +
                    "°F";

                card.querySelector(".highlow").textContent =
                    "H: " +
                    number(d.temperature_2m_max[0]) +
                    "°F | L: " +
                    number(d.temperature_2m_min[0]) +
                    "°F";

                card.querySelector(".current").innerHTML = [
                    ["Humidity",number(c.relative_humidity_2m)+"%"],
                    ["Wind",number(c.wind_speed_10m)+" mph"],
                    ["Gusts",number(c.wind_gusts_10m)+" mph"]
                ].map(v=>row(...v)).join("");

            }catch{

                card.querySelector(".condition").textContent =
                    "Weather Unavailable";
            }

        })
    );
}

const bg = document.getElementById("pageBackground");
const bgError = document.getElementById("backgroundError");

bg.onload = ()=>bgError.hidden = true;
bg.onerror = ()=>bgError.hidden = false;

updateClocks();
updateWeather();

setInterval(updateClocks,1000);
setInterval(updateWeather,300000);
</script>

</body>
</html>
