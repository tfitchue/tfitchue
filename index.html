<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSOC Weather Dashboard</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#063fbc;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
}

/* Full-screen background logo */
#pageBackground{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.30;
    pointer-events:none;
    z-index:0;
}

/* Main content */
main{
    position:relative;
    z-index:1;
    width:100%;
    height:100vh;
    padding:20px;
}

.weather-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    width:100%;
    height:100%;
